name: Build Windows (NOCTA Mini)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'android/**', '.github/workflows/android.yml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mini-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Download mpv (lecteur intégré)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=""
          for repo in shinchiro/mpv-winbuild-cmake zhongfly/mpv-winbuild; do
            url=$(gh api "repos/$repo/releases/latest" --jq '[.assets[] | select(.name | startswith("mpv-x86_64-") and endswith(".7z") and (contains("v3") | not) and (contains("dev") | not))][0].browser_download_url // empty' || true)
            if [ -n "$url" ]; then echo "mpv depuis $repo"; break; fi
          done
          echo "URL: $url"
          test -n "$url"
          curl -fsSL -o mpv.7z "$url"
          mkdir -p vendor/mpv
          7z x mpv.7z -ovendor/mpv -y > /dev/null
          if [ ! -f vendor/mpv/mpv.exe ]; then
            exe=$(find vendor/mpv -name mpv.exe | head -1)
            mv "$(dirname "$exe")"/* vendor/mpv/
          fi
          rm -rf vendor/mpv/doc vendor/mpv/installer vendor/mpv/updater.bat vendor/mpv/mpv.com 2>/dev/null || true
          ls -la vendor/mpv
          test -f vendor/mpv/mpv.exe

      - name: Version
        shell: bash
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version

      - name: Typecheck & build UI
        run: |
          npm run typecheck
          npm run build

      - name: Package (.exe)
        run: npx electron-builder --win --publish never --config build/mini-builder.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Release notes
        shell: bash
        run: |
          {
            echo "### Nouveautés"
            git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
          } > RELEASE.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mini-v0.1.${{ github.run_number }}
          name: NOCTA Mini v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: |
            release/NOCTA-Mini-Setup.exe
            release/NOCTA-Mini-Portable.exe
          body_path: RELEASE.md
