name: Build Windows

on:
  push:
    branches: [main, 'claude/laughing-bell-p4i573']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Download mpv (lecteur intégré)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=""
          for repo in shinchiro/mpv-winbuild-cmake zhongfly/mpv-winbuild; do
            url=$(gh api "repos/$repo/releases/latest" --jq '[.assets[] | select(.name | startswith("mpv-x86_64-") and endswith(".7z") and (contains("v3") | not) and (contains("dev") | not))][0].browser_download_url // empty' || true)
            if [ -n "$url" ]; then echo "mpv depuis $repo"; break; fi
          done
          echo "URL: $url"
          test -n "$url"
          curl -fsSL -o mpv.7z "$url"
          mkdir -p vendor/mpv
          7z x mpv.7z -ovendor/mpv -y > /dev/null
          if [ ! -f vendor/mpv/mpv.exe ]; then
            exe=$(find vendor/mpv -name mpv.exe | head -1)
            mv "$(dirname "$exe")"/* vendor/mpv/
          fi
          rm -rf vendor/mpv/doc vendor/mpv/installer vendor/mpv/updater.bat vendor/mpv/mpv.com 2>/dev/null || true
          ls -la vendor/mpv
          test -f vendor/mpv/mpv.exe

      - name: Version
        shell: bash
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version

      - name: Typecheck & build UI
        run: |
          npm run typecheck
          npm run build

      - name: Package (.exe)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: NOCTA v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            release/NOCTA-Setup.exe
            release/NOCTA-Portable.exe
          body: |
            **NOCTA-Setup.exe** : installeur (raccourci bureau, mises à jour faciles), recommandé.
            **NOCTA-Portable.exe** : se lance directement, sans installation.

            Windows peut afficher « Windows a protégé votre ordinateur » (app non signée) :
            clique sur *Informations complémentaires*, puis *Exécuter quand même*.
